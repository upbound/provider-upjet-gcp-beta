version: "2"
output:
  formats:
    text:
      path: stdout
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - durationcheck
    - errchkjson
    - errorlint
    - exhaustive
    - gocheckcompilerdirectives
    - gochecksumtype
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - gosmopolitan
    - loggercheck
    - makezero
    - misspell
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - noctx
    - prealloc
    - protogetter
    - reassign
    - recvcheck
    - rowserrcheck
    - spancheck
    - sqlclosecheck
    - testifylint
    - unconvert
    - unparam
    - zerologlint
  settings:
    dupl:
      threshold: 100 # tokens count to trigger issue, 150 by default
    errcheck:
      # report about not checking of errors in type assertions: `a := b.(MyStruct)`;
      # default is false: such cases aren't reported by default.
      check-type-assertions: false
      # report about assignment of errors to blank identifier: `num, _ := strconv.Atoi(numStr)`;
      # default is false: such cases aren't reported by default.
      check-blank: false
      exclude-functions:
        - io/ioutil.ReadFile
        - io.Copy(*bytes.Buffer)
        - io.Copy(os.Stdout)
    goconst:
      min-len: 3      # minimal length of string constant, 3 by default
      min-occurrences: 5 # minimal occurrences count to trigger, 3 by default
    gocritic:
      # Enable multiple checks by tags, run `GL_DEBUG=gocritic golangci-lint` run to see all tags and checks.
      # Empty list by default. See https://github.com/go-critic/go-critic#usage -> section "Tags".
      enabled-tags:
        - performance
      settings:
        captLocal:
          paramsOnly: true
        rangeValCopy:
          sizeThreshold: 32
    gocyclo:
      min-complexity: 10 # minimal code complexity to report, 30 by default (but we recommend 10-20)
    govet:
      disable:
        - shadow # disable reporting about shadowed variables
    lll:
      tab-width: 1 # tab width in spaces. Default to 1.
    nakedret:
      max-func-lines: 30 # make an issue if func has more lines of code than this setting and it has naked returns; default is 30
    prealloc:
      # XXX: we don't recommend using this linter before doing performance profiling.
      # For most programs usage of prealloc will be a premature optimization.

      # Report preallocation suggestions only on simple loops that have no returns/breaks/continues/gotos in them.
      # True by default.
      simple: true
      range-loops: true  # Report preallocation suggestions on range loops, true by default
      for-loops: false   # Report preallocation suggestions on for loops, false by default
    unparam:
      # Inspect exported functions, default is false. Set to true if no external program/library imports your code.
      # XXX: if you enable this setting, unparam will report a lot of false-positives in text editors:
      # if it's called for subdir of a project it can't find external interfaces. All text editor integrations
      # with golangci-lint call it on a directory with the changed file.
      check-exported: false
  exclusions:
    generated: lax
    rules:
      # Exclude some linters from running on tests files.
      - linters:
          - dupl
          - errcheck
          - gocyclo
          - gosec
          - scopelint
          - unparam
        path: _test(ing)?\.go
      # Ease some gocritic warnings on test files.
      - linters:
          - gocritic
        path: _test\.go
        text: (unnamedResult|exitAfterDefer)
      # These are performance optimizations rather than style issues per se.
      # They warn when function arguments or range values copy a lot of memory
      # rather than using a pointer.
      - linters:
          - gocritic
        text: '(hugeParam|rangeValCopy):'
      # This "TestMain should call os.Exit to set exit code" warning is not clever
      # enough to notice that we call a helper method that calls os.Exit.
      - linters:
          - staticcheck
        text: 'SA3000:'
      # This is a "potential hardcoded credentials" warning. It's triggered by
      # any variable with 'secret' in the name, and thus hits a lot of false
      # positives in Kubernetes land where a Secret is an object type.
      - linters:
          - gosec
        text: 'G101:'
      # This is an 'errors unhandled' warning that duplicates errcheck.
      - linters:
          - gosec
        text: 'G104:'
      # mgr.GetEventRecorderFor is deprecated at controller-runtime
      # in favor of mgr.GetEventRecorder.
      # Suppress until crossplane-runtime adapts
      - linters:
          - staticcheck
        path: internal/controller/
        text: SA1019:.*GetEventRecorderFor is deprecated
      # resource.LegacyManaged is deprecated for new implementations,
      # but we still handle legacy cluster-scoped resources
      - linters:
          - staticcheck
        path: internal/clients/gcp-beta.go
        text: SA1019:.*LegacyManaged is deprecated
      - linters:
          - staticcheck
        path: internal/clients/gcp-beta.go
        text: 'QF1008: could remove embedded field "ImpersonateServiceAccountSpec" from selector'
    paths:
      - zz_\..+\.go$
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
formatters:
  enable:
    - gofmt  # We enable this as well as goimports for its simplify mode.
    - goimports
  settings:
    gofmt:
      simplify: true # simplify code: gofmt with `-s` option, true by default
    goimports:
      # put imports beginning with prefix after 3rd-party packages
      local-prefixes:
        - github.com/upbound/provider-gcp-beta
  exclusions:
    generated: lax
    paths:
      - zz_\..+\.go$
      - third_party$
      - builtin$
      - examples$